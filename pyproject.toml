[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "libra-web-kit"
description = "Backend de login gateado de /docs/ compartido por las landings de la familia Libra (Contalibra, Restolibra, Gestiolibra, MedLibra, VentaLibra)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Mariano Cappucci" },
]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Solo para `legal_gen` y `scripts/generate_legal.py`. Va en dev y no en las
    # dependencias del paquete porque los contenedores de las landings sirven
    # HTML ya generado: meter libraauth ahi les arrastraria SQLAlchemy y un motor
    # de autenticacion entero para servir archivos estaticos.
    #
    # De aca sale el TEXTO del contrato, su hash y su conversion a HTML — los
    # tres del mismo modulo que usan las instancias, para que la pagina publicada
    # y la que se acepta adentro del sistema no puedan divergir.
    #
    # 🔴 El pin es lo que ata la pagina publicada al texto que las instancias
    # exigen aceptar. Al subir la version del contrato hay que subirlo aca
    # tambien, o la web queda publicando la anterior sin que nada falle.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.36.0",
]

[tool.hatch.metadata]
# Habilita el `libraauth @ git+https://...` del extra `dev`. Mismo patron que
# los ocho productos, que ya declaran asi sus motores.
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["libra_web_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["libra_web_kit"]
branch = true
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
# Piso de cobertura. Es un TRINQUETE, no una meta: se fija 2 puntos por
# debajo de lo que el repo mide HOY (90,36% con branch coverage,
# medido el 2026-09-03), asi que pasa holgado y lo unico que puede ponerlo en rojo es
# una regresion. Cuando la cobertura suba de verdad, subir tambien este
# numero -- nunca bajarlo para que pase un cambio.
fail_under = 88

[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

# 🔴 TRINQUETE, no "reglas que no importan". Cada linea lleva la cuenta del
# dia que se unifico el regimen: la lista SOLO se achica, y lo que no esta
# aca ya no puede entrar en codigo nuevo. Los casos auto-corregibles
# (orden de imports y modernizacion) se arreglaron en el mismo commit.
ignore = [
    "E501",      # 14 caso(s): linea de mas de 120. Sin fix automatico: hay que reescribirla.
    "F401",      # 1 caso(s): import sin usar. 🔴 NO se auto-corrige a proposito: de los 430
              #   de la familia, 168 son RE-EXPORTS —`scripts/panel_admin.py`
              #   re-exporta 27 nombres que `libracore.admin.services` usa como
              #   `pa.find_client`, `pa.compose`, `pa._NPM_AVAILABLE`—. Borrarlos
              #   rompe el backoffice en runtime con los tests en verde.
]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

