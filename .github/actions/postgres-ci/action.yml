name: PostgreSQL para el CI
description: >-
  Levanta el PostgreSQL de la suite desde el espejo oficial de ECR, con la variante que elija el repo
  (Debian o alpine), y espera a que quede sano. Reemplaza al bloque `services: postgres:` de cada workflow.

# Por qué una Action compuesta con `docker run` y no un `services:` ni un workflow reutilizable
# (diseño en el wiki: wiki/analyses/postgres-del-ci-centralizado-diseno.md):
# - una Action compuesta no puede declarar `services:`;
# - un workflow reutilizable obligaría a mover el job de tests entero, y es distinto en cada repo.
# Los jobs de la familia corren en `ubuntu-latest` sin `container:`, así que `-p <puerto>:5432` deja la base en
# `localhost:<puerto>` exactamente como el `services:` de antes.
#
# 🔴 La imagen sale de `public.ecr.aws/docker/library/postgres` y nunca de Docker Hub anónimo: el 2026-10-09 su
# límite de descargas (`toomanyrequests`) trabó el CI de toda la familia (`reglas/ci.md` del wiki).
#
# Se usa con el tag mayor móvil `postgres-ci-v1` (se mueve en cada versión compatible; un cambio incompatible es
# `postgres-ci-v2`). Al lado hay un tag exacto (`postgres-ci-v1.0.0`) para quien quiera fijarla.

inputs:
  variante:
    description: "`debian` o `alpine`. Obligatoria y sin defecto: Debian ordena texto con el collation de la locale y alpine por bytes, así que la elige cada repo según sus instancias."
    required: true
  version:
    description: Versión mayor de PostgreSQL.
    required: false
    default: "16"
  base:
    description: POSTGRES_DB.
    required: true
  usuario:
    description: POSTGRES_USER. Sin valor, el de la imagen oficial (`postgres`), como un `services:` que no lo declaraba.
    required: false
    default: "postgres"
  clave:
    description: POSTGRES_PASSWORD (de CI, no un secreto real).
    required: true
  tz:
    description: TZ del contenedor (opcional; los productos usan America/Argentina/Buenos_Aires).
    required: false
    default: ""
  puerto:
    description: Puerto del runner donde queda la base.
    required: false
    default: "5432"
  espera:
    description: Segundos máximos de espera a que quede sano.
    required: false
    default: "120"
  intervalo:
    description: --health-interval (los repos que chequeaban más seguido, p. ej. libragenda con 3s, lo conservan).
    required: false
    default: "10s"
  timeout:
    description: --health-timeout.
    required: false
    default: "5s"
  reintentos:
    description: --health-retries.
    required: false
    default: "5"

outputs:
  url:
    description: "postgresql://<usuario>:<clave>@localhost:<puerto>/<base>"
    value: ${{ steps.levantar.outputs.url }}

runs:
  using: composite
  steps:
    - id: levantar
      shell: bash
      # Las entradas van por `env` y no interpoladas en el script: así un valor raro no se ejecuta como shell.
      env:
        VARIANTE: ${{ inputs.variante }}
        VERSION_PG: ${{ inputs.version }}
        BASE: ${{ inputs.base }}
        USUARIO: ${{ inputs.usuario }}
        CLAVE: ${{ inputs.clave }}
        ZONA: ${{ inputs.tz }}
        PUERTO: ${{ inputs.puerto }}
        ESPERA: ${{ inputs.espera }}
        INTERVALO: ${{ inputs.intervalo }}
        TIMEOUT_SALUD: ${{ inputs.timeout }}
        REINTENTOS: ${{ inputs.reintentos }}
      run: |
        set -euo pipefail
        case "$VARIANTE" in
          debian) IMAGEN="public.ecr.aws/docker/library/postgres:${VERSION_PG}" ;;
          alpine) IMAGEN="public.ecr.aws/docker/library/postgres:${VERSION_PG}-alpine" ;;
          *) echo "::error::variante tiene que ser 'debian' o 'alpine', no '$VARIANTE'"; exit 1 ;;
        esac
        args=(-d --name postgres-ci -p "${PUERTO}:5432"
              -e "POSTGRES_DB=${BASE}" -e "POSTGRES_USER=${USUARIO}" -e "POSTGRES_PASSWORD=${CLAVE}"
              # 🔴 `pg_isready` por TCP (`-h 127.0.0.1`) y no por el socket: durante el `initdb` la imagen levanta un
              # servidor temporal SÓLO en el socket y después lo reinicia, así que un chequeo por socket puede dar
              # «listo» y la primera conexión de la suite, por TCP, encontrar el puerto cerrado. libra-panel ya lo
              # hacía así; desde v1.1.0 vale para todos.
              --health-cmd "pg_isready -h 127.0.0.1 -U ${USUARIO} -d ${BASE}"
              --health-interval "${INTERVALO}" --health-timeout "${TIMEOUT_SALUD}" --health-retries "${REINTENTOS}"
              --health-start-period 5s)
        if [ -n "$ZONA" ]; then args+=(-e "TZ=${ZONA}"); fi
        echo "Levantando ${IMAGEN} en localhost:${PUERTO}"
        docker run "${args[@]}" "$IMAGEN" >/dev/null
        inicio=$(date +%s)
        while true; do
          estado=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' postgres-ci)
          if [ "$estado" = "healthy" ]; then break; fi
          if [ "$estado" = "unhealthy" ] || [ "$estado" = "exited" ] || [ "$estado" = "dead" ]; then
            echo "::error::postgres-ci quedó '$estado'"; docker logs postgres-ci || true; exit 1
          fi
          if [ $(( $(date +%s) - inicio )) -ge "$ESPERA" ]; then
            echo "::error::postgres-ci no quedó sano en ${ESPERA}s (estado: $estado)"; docker logs postgres-ci || true; exit 1
          fi
          sleep 2
        done
        echo "postgres-ci healthy: ${IMAGEN} en localhost:${PUERTO} ($(( $(date +%s) - inicio ))s)"
        echo "url=postgresql://${USUARIO}:${CLAVE}@localhost:${PUERTO}/${BASE}" >> "$GITHUB_OUTPUT"
