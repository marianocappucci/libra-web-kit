name: CI

on:
  # F3 (2026-09-05): sin `push`. Los tags no disparan nada mas que esta misma
  # suite sobre un commit que el PR de promocion ya probo (no hay job de
  # release), y el push a develop/main duplicaba el run del PR. Medido en la
  # auditoria de F3, ver el wiki.
  # Sin `push` a ramas: `develop` y `main` estan protegidas (2026-08-11,
  # `enforce_admins: true`), asi que todo entra por PR y el run del PR verifica
  # el MERGE -- que es exactamente lo que queda en la rama. El push repetia esa
  # misma verificacion sobre un arbol identico: medido, tres commits distintos
  # con el mismo tree hash y hasta cuatro corridas por cambio.
  pull_request:
    branches: [develop, main]

# Una sola corrida viva por rama. Si entra un push nuevo mientras esta
# corriendo, se cancela la anterior en vez de pagar las dos: su resultado ya
# no le sirve a nadie, porque reporta sobre un codigo que no es el que quedo
# en la rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Los repos de la familia vuelven a PRIVADO el 2026-09-01: sin
      # credenciales, `pip` no puede clonarlos y el build falla adentro del
      # install, con un error de git que no dice cual repo fallo.
      #
      # Una deploy key ES una identidad por repo, y con dos o mas cargadas SSH
      # las ofrece en orden: GitHub autentica con la primera que acepta, que
      # puede no ser la del repo que se esta clonando. Por eso el alias
      # `github-<repo>` con `IdentitiesOnly yes`, y no `github.com` a secas.
      #
      # Estructura generalizada (la misma de libradesk/gestiolibra/medlibra):
      # agregar una dependencia privada nueva es una linea de `configurar`.
      - name: Configurar acceso SSH a las dependencias privadas de Libra
        env:
          LIBRAAUTH_DEPLOY_KEY: ${{ secrets.LIBRAAUTH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          configurar() {
            repo=$1; clave=$2
            if [ -z "$clave" ]; then
              echo "::error::Falta el secret con la deploy key de $repo en este repositorio."
              echo "Sin el, pip no puede clonar $repo (repo privado) y el build falla."
              echo "Es la clave privada de una deploy key de solo lectura sobre marianocappucci/$repo."
              exit 1
            fi
            printf '%s\n' "$clave" > ~/.ssh/id_"$repo"
            chmod 600 ~/.ssh/id_"$repo"
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_%s\n  IdentitiesOnly yes\n' \
              "$repo" "$repo" >> ~/.ssh/config
            git config --global \
              url."git@github-$repo:marianocappucci/$repo".insteadOf \
              "https://github.com/marianocappucci/$repo"
          }
          configurar libraauth "$LIBRAAUTH_DEPLOY_KEY"

      # Confirma que cada clave autentica contra SU repo y no contra otro: es
      # exactamente el modo de fallar que motiva los alias de arriba, y sin
      # este paso recien se notaria adentro del pip install.
      - name: Verificar que cada deploy key resuelve a su propio repo
        run: |
          for repo in libraauth; do
            saludo=$(ssh -o StrictHostKeyChecking=yes -T "git@github-$repo" 2>&1 || true)
            echo "$repo -> $saludo"
            case "$saludo" in
              *"marianocappucci/$repo"*) ;;
              *) echo "::error::La deploy key de $repo no resuelve a marianocappucci/$repo."; exit 1 ;;
            esac
          done

      # F1 (2026-09-05): el entorno sale de `uv.lock`, no de la resolucion del dia.
      # `--locked` falla si el lock no coincide con pyproject.toml: un pin que se
      # mueve sin regenerar el lock pone rojo aca, no en produccion. El venv entra
      # al PATH para que los pasos siguientes (ruff, pytest, alembic, scripts)
      # sigan invocandose igual que antes.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
      - name: Install package + dev deps (uv.lock)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing

  # F2 (2026-09-05): que el CI ponga rojo un commit con un secreto. Barre los
  # commits del PR (no toda la historia) con la configuracion de
  # `.gitleaks.toml` en la raiz, que exime `tests/` porque ahi viven las
  # contrasenas de prueba de la suite. Job independiente: corre en paralelo y
  # su rojo no se mezcla con el de la suite.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
