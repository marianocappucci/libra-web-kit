name: Deploy a VPS (reusable)

# Reusable workflow para el deploy de las 5 landings de la familia Libra
# (Contalibra, Restolibra, Gestiolibra, MedLibra, VentaLibra) -- extraído
# 2026-07-26, era ~38 líneas idénticas salvo `remote_path` en cada repo.
# Ver wiki/analyses/auditoria-duplicacion-familia-libra.md (P3).
#
# Cada landing lo llama con:
#
#   jobs:
#     deploy:
#       uses: marianocappucci/libra-web-kit/.github/workflows/deploy-vps.yml@main
#       with:
#         remote_path: /root/gestiolibra_web/
#       secrets: inherit

on:
  workflow_call:
    inputs:
      remote_path:
        description: "Ruta absoluta en el VPS donde vive el checkout (con barra final)."
        required: true
        type: string
      servicio_web:
        # `restolibra_web` llama al suyo `restolibra-web` y los otros siete
        # `web`. Estaba hardcodeado en la verificacion de abajo, asi que ese
        # deploy fallaba con `no such service: web` desde el 2026-08-22 --con el
        # rsync y el rebuild ya hechos, o sea que el sitio quedaba bien y el
        # workflow en rojo. El default deja a los siete como estaban.
        description: "Nombre del servicio del compose que sirve la pagina."
        required: false
        default: web
        type: string
    secrets:
      VPS_DEPLOY_KEY:
        required: true
      # 🔴 La direccion del VPS sale de secrets desde el 2026-09-07, no de este
      # archivo. El repo es publico: hasta esa fecha `deploy-vps.yml` publicaba
      # la IP, el puerto no estandar y que el usuario de SSH es `root`, y ese
      # fue el unico lugar donde el puerto y el usuario estaban a la vista.
      # La IP no se gana nada escondiendola --los ocho dominios resuelven ahi--
      # pero el puerto y el usuario si. Ademas los secrets se enmascaran en el
      # log, que en un repo publico tambien lo lee cualquiera.
      # Ver wiki/analyses/incidente-acceso-no-autorizado-vps-2026-09-06.md
      VPS_HOST:
        required: true
      VPS_PORT:
        required: true
      VPS_USER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync archivos al VPS
        uses: burnett01/rsync-deployments@9.0.0
        with:
          # 🔴 El `--include` de `public/legal/*.md` va ANTES del `--exclude`
          # de `*.md`: rsync aplica la primera regla que matchea, asi que al
          # reves no serviria de nada.
          #
          # Existe porque `--exclude='*.md'` —puesto para no publicar el README
          # del repo— tambien se llevaba el **texto original del contrato**, que
          # es lo unico que hace verificable el sha256 que la pagina anuncia.
          # El sintoma no se parecia a la causa: el HTML se publicaba y daba
          # 200 en los ocho sitios, y el `.md` daba 404 en los ocho.
          switches: -avz --delete --exclude='.git' --exclude='.github' --include='public/legal/*.md' --exclude='*.md' --exclude='.claude' --exclude='.env'
          path: ./
          remote_path: ${{ inputs.remote_path }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Rebuild y restart Docker
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            # 🔴 `set -euo pipefail` y NO un `echo` final que tape el codigo de
            # salida.
            #
            # Sin esto, el paso corria `docker compose build`, fallaba, seguia
            # de largo con `up -d` —que no cambia nada porque no hay imagen
            # nueva— y terminaba con un `echo` exitoso. El shell devolvia 0, el
            # workflow se pintaba verde, y la landing seguia sirviendo la
            # pagina anterior.
            #
            # Paso de verdad el 2026-08-06: cinco landings reportaron "Deploy a
            # VPS | success" mientras servian el HTML viejo. El build fallaba
            # con `failed to fetch oauth token: denied` al bajar la imagen base
            # de GHCR — el token del VPS habia vencido. Un deploy que dice OK y
            # no desplego es peor que uno que falla.
            set -euo pipefail
            cd ${{ inputs.remote_path }}
            docker compose build --no-cache
            docker compose up -d
            echo "Deploy OK: $(date)"

      - name: Verificar que la pagina servida cambio
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            # La contraprueba del paso anterior: que lo que SIRVE el contenedor
            # sea lo mismo que hay en el checkout. Un build que no corrio deja
            # las dos cosas distintas, y eso es lo unico que lo delata desde
            # afuera.
            set -euo pipefail
            cd ${{ inputs.remote_path }}
            contenedor=$(docker compose ps -q ${{ inputs.servicio_web }})
            if [ -z "$contenedor" ]; then
              echo "!! no hay contenedor '${{ inputs.servicio_web }}' corriendo"; exit 1
            fi
            en_disco=$(md5sum public/index.html | cut -d' ' -f1)
            servido=$(docker exec "$contenedor" md5sum /usr/share/nginx/html/index.html | cut -d' ' -f1)
            echo "  en el checkout: $en_disco"
            echo "  en el contenedor: $servido"
            if [ "$en_disco" != "$servido" ]; then
              echo "!! el contenedor sirve una version distinta de la que se sincronizo"
              exit 1
            fi
            echo "OK: el contenedor sirve lo que se acaba de sincronizar"
