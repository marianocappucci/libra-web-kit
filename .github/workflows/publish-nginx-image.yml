name: Publicar imagen nginx compartida

# Build + push de la imagen base de nginx compartida por las 5 landings
# (ver nginx/README para el contexto). Se dispara solo cuando cambia algo
# bajo nginx/, y en tags v* del propio repo (asi el tag del paquete
# Python y el de esta imagen quedan alineados si conviene).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "nginx/**"
      - ".github/workflows/publish-nginx-image.yml"

# Un deploy por vez, y los que lleguen mientras tanto ESPERAN.
#
# `cancel-in-progress: false` a proposito, al reves que en los CI: cortar un
# deploy a la mitad deja el rsync hecho y el contenedor sin reconstruir, que es
# peor que esperar.
#
# No es hipotetico. El 2026-08-07 un solo push a libradesk_web disparo dos
# corridas de este mismo workflow para el mismo commit, con 2 segundos de
# diferencia; corrieron en paralelo sobre el mismo directorio del VPS y una
# murio con `Conflict. The container name "..." is already in use`. Peor: la que
# fallo lo hizo en "Rebuild y restart Docker", asi que su paso de verificacion
# quedo `skipped` -- el deploy que falla es el que no llega a comprobar nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS="ghcr.io/marianocappucci/libra-nginx-web:latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,ghcr.io/marianocappucci/libra-nginx-web:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ steps.tags.outputs.tags }}
